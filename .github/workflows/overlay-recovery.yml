name: OSRS overlay recovery verification
on:
  push:
    branches: [fix/osrs-overlay-recovery-oct24]
    paths: ['.github/workflows/overlay-recovery.yml', 'repair/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: osrs-overlay-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize reviewed OSRS-only patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          files = sorted(pathlib.Path('repair').glob('overlay-recovery.patch.xz.b64.*'))
          assert len(files) == 5, 'Missing source bundle part'
          encoded = ''.join(p.read_text().strip() for p in files)
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(data) < 250000
          assert hashlib.sha256(data).hexdigest() == '93fb32695c9d76975ab60d61a9bd8fed3a845d1a160574fd3626be81a9383368', 'Source bundle integrity failed'
          patch = pathlib.Path('/tmp/overlay-recovery.patch'); patch.write_bytes(data)
          for line in data.decode().splitlines():
              if line.startswith('+++ b/'):
                  name = line[6:]
                  assert name.startswith(('app/', 'mcp-bridge/')) and '..' not in name.split('/'), name
          apply = subprocess.run(['git','apply','--check',str(patch)], capture_output=True, text=True)
          if apply.returncode == 0:
              subprocess.run(['git','apply',str(patch)], check=True)
              subprocess.run(['git','add','app','mcp-bridge'], check=True)
              subprocess.run(['git','-c','user.name=OSRS Recovery','-c','user.email=95941803+MrLeefy@users.noreply.github.com','commit','-m','fix: rebuild OSRS overlay persistence, connection UX, and mixed-protocol routing'], check=True)
              subprocess.run(['git','push','origin','HEAD:fix/osrs-overlay-recovery-oct24'], check=True)
          else:
              subprocess.run(['git','apply','--reverse','--check',str(patch)], check=True)
          subprocess.run(['git','diff','--check'], check=True)
          PY
      - name: Capture exact patched source revision
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=zip HEAD -o /tmp/osrs-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: osrs-repaired-source-${{ steps.revision.outputs.sha }}
          path: /tmp/osrs-source.zip
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MCP portable regression suite
        id: node
        continue-on-error: true
        run: |
          cd mcp-bridge
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee /tmp/osrs-node-tests.log
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build, lint and instrumentation compile
        id: build
        continue-on-error: true
        run: bash gradlew :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Complete Android unit suite (known fixture failures remain visible)
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash gradlew :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Enable emulator virtualization
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 emulator persistence and screen tests
        id: emulator
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-boot-timeout: 240
          disable-animations: true
          script: |
            bash gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2
      - name: Record exact outcomes, not green badges
        if: always()
        run: |
          mkdir -p verification
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          suites=[]
          for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=ET.parse(p).getroot(); suites.append({'name':r.get('name'),**{k:int(r.get(k,'0')) for k in ['tests','failures','errors','skipped']}})
          totals={k:sum(s[k] for s in suites) for k in ['tests','failures','errors','skipped']}
          result={'source':'${{ steps.revision.outputs.sha }}','node':'${{ steps.node.outcome }}','build_lint':'${{ steps.build.outcome }}','full_unit':'${{ steps.unit.outcome }}','emulator':'${{ steps.emulator.outcome }}','totals':totals,'suites':suites,'oracle_integration':'Not run: this workflow has no Oracle credentials or live server access','signing':'CI DEBUG KEY ONLY. Not an in-place update. Do not uninstall the existing app.','physical_s23':'Not tested','live_deployment':'Not performed'}
          pathlib.Path('verification/results.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
          cat verification/results.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osrs-recovery-verification-${{ steps.revision.outputs.sha }}
          path: |
            verification/
            /tmp/osrs-node-tests.log
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/
            app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Gate new regressions (do not hide failing tests)
        if: always()
        run: |
          test '${{ steps.node.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.emulator.outcome }}' = success
          python3 - <<'PY'
          import json
          d=json.load(open('verification/results.json'))
          allowed={'com.example.waspmobile.engine.AdversarialM4ClusterTest','com.example.waspmobile.engine.AdversarialM4Test','com.example.waspmobile.vision.RealScreenshotVisionTest'}
          assert d['totals']['tests'] >= 131
          assert d['totals']['errors'] == 0
          assert all(s['name'] in allowed for s in d['suites'] if s['failures']), 'Unexpected Android assertion failure'
          assert d['totals']['failures'] <= 11
          PY
